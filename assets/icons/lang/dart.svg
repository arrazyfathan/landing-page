<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <filter id="sticker-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#141410" flood-opacity="0.16" />
    </filter>
  </defs>

  <g transform="rotate(4 64 64)">
    <!-- White die-cut sticker border with soft shadow -->
    <g filter="url(#sticker-shadow)">
      <path d="M 35 35 L 61 21 Q 68 17 74 23 L 106 55 L 106 91 L 91 91 L 91 106 L 55 106 L 23 74 Q 17 68 21 61 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" />
    </g>

    <!-- Left dark blue wing -->
    <path d="M 35 35 L 21 61 Q 17 68 23 74 L 39 90 L 35 84 Z" fill="#0B589E" />
    <!-- Top sky-blue wing -->
    <path d="M 35 35 L 61 21 Q 68 17 74 23 L 90 39 L 80 35 Z" fill="#4CC3FF" />
    <!-- Main upper-right deep Dart blue plane -->
    <path d="M 35 35 L 82 35 Q 87 35 91 39 L 106 55 L 106 91 L 91 91 Z" fill="#0E5FA8" />
    <!-- Bottom sky-blue wing -->
    <path d="M 38 89 L 55 106 L 91 106 L 91 91 L 44 91 Z" fill="#4CC3FF" />
    <!-- Main lower-left bright cyan-blue plane -->
    <path d="M 35 35 L 91 91 L 45 91 Q 35 91 35 81 Z" fill="#29B6F6" />

    <!-- Subtle glossy highlight on front plane -->
    <line x1="45" y1="58" x2="45" y2="79" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="4.5" stroke-linecap="round" />

    <!-- Outer bold ink outline -->
    <path d="M 35 35 L 61 21 Q 68 17 74 23 L 106 55 L 106 91 L 91 91 L 91 106 L 55 106 L 23 74 Q 17 68 21 61 Z" stroke="#141410" stroke-width="6" stroke-linejoin="round" />
  </g>
</svg>
