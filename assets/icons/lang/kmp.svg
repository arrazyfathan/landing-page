<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <filter id="sticker-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#141410" flood-opacity="0.16" />
    </filter>
    <linearGradient id="kmp-grad" x1="22" y1="106" x2="104" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C711E1" />
      <stop offset="44%" stop-color="#7F52FF" />
      <stop offset="78%" stop-color="#3E8BFF" />
      <stop offset="100%" stop-color="#22C3FF" />
    </linearGradient>
  </defs>

  <g transform="rotate(4 64 64)">
    <!-- White die-cut sticker border with soft shadow -->
    <g filter="url(#sticker-shadow)">
      <path d="M 29 22 L 105 22 L 67 60 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" />
      <path d="M 22 29 L 53 60 L 22 60 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" />
      <path d="M 22 68 L 53 68 L 22 99 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" />
      <path d="M 29 106 L 105 106 L 67 68 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" />
    </g>

    <!-- 4 KMP shard triangles with shared continuous gradient and bold ink outline -->
    <!-- Top triangle -->
    <path d="M 29 22 L 105 22 L 67 60 Z" fill="url(#kmp-grad)" stroke="#141410" stroke-width="5.5" stroke-linejoin="round" />
    <!-- Upper-left triangle -->
    <path d="M 22 29 L 53 60 L 22 60 Z" fill="url(#kmp-grad)" stroke="#141410" stroke-width="5.5" stroke-linejoin="round" />
    <!-- Lower-left triangle -->
    <path d="M 22 68 L 53 68 L 22 99 Z" fill="url(#kmp-grad)" stroke="#141410" stroke-width="5.5" stroke-linejoin="round" />
    <!-- Bottom triangle -->
    <path d="M 29 106 L 105 106 L 67 68 Z" fill="url(#kmp-grad)" stroke="#141410" stroke-width="5.5" stroke-linejoin="round" />

    <!-- Subtle glossy highlight -->
    <line x1="48" y1="31" x2="77" y2="31" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
