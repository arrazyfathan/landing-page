<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <filter id="sticker-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#141410" flood-opacity="0.16" />
    </filter>
  </defs>

  <g transform="rotate(-4 64 64)">
    <!-- White die-cut sticker border -->
    <g filter="url(#sticker-shadow)">
      <!-- Main 4-point sparkle base -->
      <path d="M 54 22 C 56 46 66 56 90 58 C 66 60 56 70 54 94 C 52 70 42 60 18 58 C 42 56 52 46 54 22 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="19" stroke-linejoin="round" />
      <!-- Small top-right sparkle base -->
      <path d="M 94 24 C 95.5 34 100 38.5 110 40 C 100 41.5 95.5 46 94 56 C 92.5 46 88 41.5 78 40 C 88 38.5 92.5 34 94 24 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="17" stroke-linejoin="round" />
      <!-- Tiny bottom-right glint base -->
      <circle cx="90" cy="88" r="8" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" />
    </g>

    <!-- Main 4-point sparkle (electric blue matching brand accent) -->
    <path d="M 54 22 C 56 46 66 56 90 58 C 66 60 56 70 54 94 C 52 70 42 60 18 58 C 42 56 52 46 54 22 Z" fill="#0380FC" stroke="#141410" stroke-width="6" stroke-linejoin="round" />

    <!-- Subtle glossy gleam on main sparkle -->
    <path d="M 50 42 C 48 48 45 51 39 54" stroke="#FFFFFF" stroke-opacity="0.58" stroke-width="4" stroke-linecap="round" />

    <!-- Companion top-right sparkle (warm yellow) -->
    <path d="M 94 24 C 95.5 34 100 38.5 110 40 C 100 41.5 95.5 46 94 56 C 92.5 46 88 41.5 78 40 C 88 38.5 92.5 34 94 24 Z" fill="#FFC629" stroke="#141410" stroke-width="5.2" stroke-linejoin="round" />

    <!-- Tiny bottom-right spark dot -->
    <circle cx="90" cy="88" r="6.5" fill="#70B8FF" stroke="#141410" stroke-width="4.8" />
  </g>
</svg>
