<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <filter id="sticker-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#141410" flood-opacity="0.16" />
    </filter>
    <clipPath id="globe-clip">
      <circle cx="64" cy="64" r="41" />
    </clipPath>
  </defs>

  <g transform="rotate(4 64 64)">
    <!-- White die-cut sticker border with soft shadow -->
    <g filter="url(#sticker-shadow)">
      <circle cx="64" cy="64" r="42" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" />
      <rect x="18" y="49" width="92" height="30" rx="8" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round" />
    </g>

    <!-- Blue globe body -->
    <circle cx="64" cy="64" r="42" fill="#4CC3FF" />

    <!-- Globe meridian & latitude lines clipped to circle -->
    <g clip-path="url(#globe-clip)">
      <ellipse cx="64" cy="64" rx="20" ry="42" stroke="#141410" stroke-width="5.2" />
      <line x1="64" y1="22" x2="64" y2="106" stroke="#141410" stroke-width="5.2" />
      <path d="M 27 42 Q 64 51 101 42" stroke="#141410" stroke-width="5.2" fill="none" />
      <path d="M 27 86 Q 64 77 101 86" stroke="#141410" stroke-width="5.2" fill="none" />
      <!-- Subtle glossy highlight -->
      <path d="M 35 45 A 33 33 0 0 1 54 31" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="4.5" stroke-linecap="round" />
    </g>

    <!-- Outer globe ink outline -->
    <circle cx="64" cy="64" r="42" stroke="#141410" stroke-width="6.2" />

    <!-- Crisp white WWW ribbon band -->
    <rect x="18" y="49" width="92" height="30" rx="8" fill="#FFFFFF" stroke="#141410" stroke-width="5.5" stroke-linejoin="round" />

    <!-- Pure vector "WWW" -->
    <path d="M 28 58 L 32 71 L 36.5 60 L 41 71 L 45 58" stroke="#141410" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 55.5 58 L 59.5 71 L 64 60 L 68.5 71 L 72.5 58" stroke="#141410" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 83 58 L 87 71 L 91.5 60 L 96 71 L 100 58" stroke="#141410" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
