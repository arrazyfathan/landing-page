<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <filter id="sticker-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#141410" flood-opacity="0.16" />
    </filter>
  </defs>

  <g transform="rotate(4 64 64)">
    <!-- White die-cut sticker border with soft shadow -->
    <g filter="url(#sticker-shadow)">
      <rect x="22" y="22" width="84" height="84" rx="16" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" />
    </g>

    <!-- Charcoal-black badge -->
    <rect x="22" y="22" width="84" height="84" rx="16" fill="#1C1C18" stroke="#141410" stroke-width="6.5" stroke-linejoin="round" />

    <!-- Subtle glossy corner highlight -->
    <path d="M 33 45 L 33 37 C 33 34.5 35 33 37.5 33 L 49 33" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4.5" stroke-linecap="round" />

    <!-- Official X mark (pure vector) -->
    <!-- Back thin diagonal -->
    <path d="M 41 89 L 81 39 L 88 39 L 48 89 Z" fill="#FFFFFF" />
    <!-- Front hollow ribbon -->
    <path d="M 39 39 L 55.5 39 L 89 89 L 72.5 89 Z" fill="#FFFFFF" />
    <path d="M 46.5 43.5 L 52.5 43.5 L 81.5 84.5 L 75.5 84.5 Z" fill="#1C1C18" />
  </g>
</svg>
