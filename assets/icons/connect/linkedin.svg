<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <filter id="sticker-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#141410" flood-opacity="0.16" />
    </filter>
  </defs>

  <g transform="rotate(-4 64 64)">
    <!-- White die-cut sticker border with soft shadow -->
    <g filter="url(#sticker-shadow)">
      <rect x="22" y="22" width="84" height="84" rx="16" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" />
    </g>

    <!-- LinkedIn blue badge -->
    <rect x="22" y="22" width="84" height="84" rx="16" fill="#0A77B5" stroke="#141410" stroke-width="6.5" stroke-linejoin="round" />

    <!-- Subtle glossy corner highlight -->
    <path d="M 33 45 L 33 37 C 33 34.5 35 33 37.5 33 L 49 33" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="4.5" stroke-linecap="round" />

    <!-- Pure vector "in" -->
    <circle cx="44" cy="44" r="6.2" fill="#FFFFFF" />
    <rect x="38.2" y="55" width="11.6" height="35" rx="2.5" fill="#FFFFFF" />
    <path d="M 57 55 H 68 V 60.5 C 70.5 56.5 74.8 54 80.2 54 C 89.2 54 93 60 93 69.5 V 90 H 81.4 V 71.5 C 81.4 66.5 79.4 63.8 75.2 63.8 C 70.8 63.8 68.6 66.8 68.6 71.8 V 90 H 57 Z" fill="#FFFFFF" />
  </g>
</svg>
