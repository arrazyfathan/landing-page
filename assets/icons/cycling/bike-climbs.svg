<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <filter id="sticker-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#141410" flood-opacity="0.16" />
    </filter>
  </defs>

  <g transform="rotate(-4 64 66)">
    <!-- White die-cut sticker border -->
    <g filter="url(#sticker-shadow)">
      <path d="M 18 96 L 62 34 L 78 58 L 92 42 L 112 96 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="19" stroke-linejoin="round" />
      <path d="M 24 62 L 46 34 M 34 34 H 46 V 46" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Rear peak (deep teal-blue) -->
    <path d="M 62 96 L 92 42 L 112 96 Z" fill="#2B62F6" stroke="#141410" stroke-width="6.2" stroke-linejoin="round" />

    <!-- Main steep climb mountain (vibrant emerald) -->
    <path d="M 18 96 L 62 34 L 94 96 Z" fill="#3ED682" stroke="#141410" stroke-width="6.2" stroke-linejoin="round" />

    <!-- Crisp snow/summit cap on main peak -->
    <path d="M 62 34 L 73 55 L 64 51 L 56 56 L 49 52 Z" fill="#FFFDF8" stroke="#141410" stroke-width="5" stroke-linejoin="round" />

    <!-- Climbing grade arrow (bold ink + warm yellow core) -->
    <path d="M 22 60 L 44 33" stroke="#141410" stroke-width="13" stroke-linecap="round" />
    <path d="M 32 33 H 44 V 45" stroke="#141410" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 22 60 L 44 33" stroke="#FFC629" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 32 33 H 44 V 45" stroke="#FFC629" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Glossy slope highlight -->
    <path d="M 33 84 L 46 66" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
