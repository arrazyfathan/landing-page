<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <filter id="sticker-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#141410" flood-opacity="0.16" />
    </filter>
  </defs>

  <g transform="rotate(-4 64 64)">
    <!-- White die-cut sticker border -->
    <g filter="url(#sticker-shadow)">
      <path d="M 34 78 C 24 58 34 32 58 30 C 78 28 84 44 96 50 C 108 56 108 82 90 92 C 72 102 44 98 34 78 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="22" stroke-linejoin="round" />
      <circle cx="46" cy="40" r="11" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" />
    </g>

    <!-- Soft warm map backdrop inside loop -->
    <path d="M 34 78 C 24 58 34 32 58 30 C 78 28 84 44 96 50 C 108 56 108 82 90 92 C 72 102 44 98 34 78 Z" fill="#FFF7DC" />

    <!-- Bold GPS route loop (black outline + Strava orange core) -->
    <path d="M 34 78 C 24 58 34 32 58 30 C 78 28 84 44 96 50 C 108 56 108 82 90 92 C 72 102 44 98 34 78 Z" stroke="#141410" stroke-width="14.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 34 78 C 24 58 34 32 58 30 C 78 28 84 44 96 50 C 108 56 108 82 90 92 C 72 102 44 98 34 78 Z" stroke="#FC4C02" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Directional arrow chevron on right bend -->
    <path d="M 88 81 L 96 89 L 85 95" stroke="#141410" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Start / Finish pin marker -->
    <circle cx="46" cy="39" r="10.5" fill="#FFC629" stroke="#141410" stroke-width="5.5" />
    <circle cx="46" cy="39" r="3" fill="#141410" />
  </g>
</svg>
