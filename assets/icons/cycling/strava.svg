<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <filter id="sticker-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#141410" flood-opacity="0.16" />
    </filter>
  </defs>

  <g transform="rotate(-4 64 64)">
    <!-- White die-cut sticker border with soft shadow -->
    <g filter="url(#sticker-shadow)">
      <rect x="22" y="22" width="84" height="84" rx="16" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" />
    </g>

    <!-- Strava orange badge -->
    <rect x="22" y="22" width="84" height="84" rx="16" fill="#F25422" stroke="#141410" stroke-width="6.5" stroke-linejoin="round" />

    <!-- Subtle glossy corner highlight -->
    <path d="M 33 45 L 33 37 C 33 34.5 35 33 37.5 33 L 49 33" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="4.5" stroke-linecap="round" />

    <!-- Upper white Strava chevron -->
    <path d="M 59 35 L 78 72 H 67 L 59 56.5 L 51 72 H 40 Z" fill="#FFFFFF" />

    <!-- Lower translucent-white Strava chevron -->
    <path d="M 72.5 96 L 59 72 H 67.5 L 72.5 81.5 L 77.5 72 H 86 Z" fill="#FFFFFF" fill-opacity="0.6" />
  </g>
</svg>
