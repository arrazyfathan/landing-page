<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <filter id="sticker-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#141410" flood-opacity="0.16" />
    </filter>
  </defs>

  <g transform="rotate(-5 64 66)">
    <!-- White die-cut sticker border with soft shadow -->
    <g filter="url(#sticker-shadow)">
      <line x1="45" y1="54" x2="33" y2="33" stroke="#FFFFFF" stroke-width="25" stroke-linecap="round" />
      <line x1="83" y1="54" x2="95" y2="33" stroke="#FFFFFF" stroke-width="25" stroke-linecap="round" />
      <path d="M 19 95 A 45 43 0 0 1 109 95 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="19" stroke-linejoin="round" />
    </g>

    <!-- Antennae (black outline + green core) -->
    <line x1="45" y1="54" x2="33" y2="33" stroke="#141410" stroke-width="14.5" stroke-linecap="round" />
    <line x1="83" y1="54" x2="95" y2="33" stroke="#141410" stroke-width="14.5" stroke-linecap="round" />
    <line x1="45" y1="54" x2="33" y2="33" stroke="#3ED682" stroke-width="4.5" stroke-linecap="round" />
    <line x1="83" y1="54" x2="95" y2="33" stroke="#3ED682" stroke-width="4.5" stroke-linecap="round" />

    <!-- Android dome head -->
    <path d="M 19 95 A 45 43 0 0 1 109 95 Z" fill="#3ED682" stroke="#141410" stroke-width="6.5" stroke-linejoin="round" />

    <!-- Subtle glossy highlight arc -->
    <path d="M 37 67 A 33 31 0 0 1 58 58" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="4.5" stroke-linecap="round" />

    <!-- Eyes -->
    <circle cx="45" cy="79" r="5.3" fill="#FFFFFF" stroke="#141410" stroke-width="3.2" />
    <circle cx="83" cy="79" r="5.3" fill="#FFFFFF" stroke="#141410" stroke-width="3.2" />
  </g>
</svg>
