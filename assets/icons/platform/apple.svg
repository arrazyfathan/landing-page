<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <filter id="sticker-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#141410" flood-opacity="0.16" />
    </filter>
  </defs>

  <g transform="rotate(5 64 64)">
    <!-- White die-cut sticker border with soft shadow -->
    <g filter="url(#sticker-shadow)">
      <!-- Leaf sticker base -->
      <path d="M 63 42 C 62 31 69 22 80 21 C 81 32 74 42 63 42 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" />
      <!-- Apple body sticker base -->
      <path d="M 64 49 C 56 49 51 43 43 43 C 31 43 24 54 25 70 C 26 88 37 106 47 106 C 53 106 57 102 64 102 C 71 102 75 106 81 106 C 89 106 96 96 100 86 C 90 83 84 75 84 66 C 84 57 90 50 96 48 C 91 44 85 43 80 43 C 73 43 69 49 64 49 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" />
    </g>

    <!-- Leaf -->
    <path d="M 63 42 C 62 31 69 22 80 21 C 81 32 74 42 63 42 Z" fill="#1C1C18" stroke="#141410" stroke-width="5" stroke-linejoin="round" />

    <!-- Apple body -->
    <path d="M 64 49 C 56 49 51 43 43 43 C 31 43 24 54 25 70 C 26 88 37 106 47 106 C 53 106 57 102 64 102 C 71 102 75 106 81 106 C 89 106 96 96 100 86 C 90 83 84 75 84 66 C 84 57 90 50 96 48 C 91 44 85 43 80 43 C 73 43 69 49 64 49 Z" fill="#1C1C18" stroke="#141410" stroke-width="5.5" stroke-linejoin="round" />

    <!-- Playful glossy highlight curve -->
    <path d="M 35 67 C 35 58 40 53 46 52" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
