<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <filter id="sticker-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#141410" flood-opacity="0.16" />
    </filter>
    <linearGradient id="appstore-grad" x1="64" y1="22" x2="64" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1EC2FF" />
      <stop offset="52%" stop-color="#1A92FC" />
      <stop offset="100%" stop-color="#1C64F2" />
    </linearGradient>
    <mask id="cut-below-bar" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect x="0" y="0" width="128" height="128" fill="#FFFFFF" />
      <line x1="30" y1="74" x2="64" y2="74" stroke="#000000" stroke-width="15.5" stroke-linecap="round" />
    </mask>
    <mask id="cut-by-left-leg" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect x="0" y="0" width="128" height="128" fill="#FFFFFF" />
      <line x1="69" y1="40" x2="49" y2="74" stroke="#000000" stroke-width="15.5" stroke-linecap="round" />
    </mask>
    <mask id="cut-by-right-leg" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect x="0" y="0" width="128" height="128" fill="#FFFFFF" />
      <line x1="59" y1="40" x2="86.5" y2="87.5" stroke="#000000" stroke-width="16" stroke-linecap="round" />
    </mask>
  </defs>

  <g transform="rotate(-4 64 64)">
    <!-- White die-cut sticker border with soft shadow -->
    <g filter="url(#sticker-shadow)">
      <rect x="22" y="22" width="84" height="84" rx="19" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" />
    </g>

    <!-- App Store gradient badge -->
    <rect x="22" y="22" width="84" height="84" rx="19" fill="url(#appstore-grad)" stroke="#141410" stroke-width="6.5" stroke-linejoin="round" />

    <!-- Subtle glossy highlight -->
    <path d="M 33 47 L 33 40 C 33 36 36 33 40 33 L 47 33" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="4" stroke-linecap="round" />

    <!-- App Store overlapping white "A" mark -->
    <!-- Lower-left foot stub (passes under horizontal bar) -->
    <line x1="41.5" y1="87.5" x2="49" y2="74" stroke="#FFFFFF" stroke-width="8.2" stroke-linecap="round" mask="url(#cut-below-bar)" />

    <!-- Horizontal crossbar (left-to-mid passes under right leg) -->
    <line x1="37" y1="74" x2="78.5" y2="74" stroke="#FFFFFF" stroke-width="8.2" stroke-linecap="round" mask="url(#cut-by-right-leg)" />

    <!-- Main left leg (top-right apex to crossbar) -->
    <line x1="69" y1="40" x2="49" y2="74" stroke="#FFFFFF" stroke-width="8.2" stroke-linecap="round" />

    <!-- Top-left apex tip -->
    <line x1="59" y1="40" x2="64" y2="48.5" stroke="#FFFFFF" stroke-width="8.2" stroke-linecap="round" />

    <!-- Main right leg (passes under left leg below apex) -->
    <line x1="64" y1="48.5" x2="86.5" y2="87.5" stroke="#FFFFFF" stroke-width="8.2" stroke-linecap="round" mask="url(#cut-by-left-leg)" />

    <!-- Right crossbar stub -->
    <line x1="78.5" y1="74" x2="91" y2="74" stroke="#FFFFFF" stroke-width="8.2" stroke-linecap="round" />
  </g>
</svg>
